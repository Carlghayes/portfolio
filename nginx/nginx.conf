worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Hide Nginx version from response headers
    server_tokens off;

    # Limit request size — prevents large payload attacks
    client_max_body_size 1m;

    # Timeouts — prevents slow loris attacks
    client_body_timeout   12;
    client_header_timeout 12;
    keepalive_timeout     15;
    send_timeout          10;

    sendfile on;
    tcp_nopush on;

    # Gzip — smaller payloads, faster loads
    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
    gzip_min_length 256;

    server {
        listen 80;
        server_name _;

        root  /usr/share/nginx/html;
        index index.html;

        # Security headers
        add_header X-Frame-Options           "SAMEORIGIN"                    always;
        add_header X-Content-Type-Options    "nosniff"                       always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy   "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://api.github.com https://gql.hashnode.com;" always;

        # Don't serve hidden files (e.g. .env, .git)
        location ~ /\. {
            deny all;
        }

        # Cache static assets
        location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg)$ {
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }

        # SPA fallback
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}